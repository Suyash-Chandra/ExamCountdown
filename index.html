<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamCountdown 2026</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="icon" href="https://cdn-icons-png.freepik.com/512/3564/3564798.png" type="image">
</head>
<body>
    <div class="container">
        <h1>ExamCountdown 2026</h1>
        <div class="main-timer" id="mainTimer">
            <h2 id="examTitle">Select an Exam</h2>
            <div id="countdown">
                <div class="time-unit">
                    <span class="time-value" id="days">--</span>
                    <span class="time-label">days</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="hours">--</span>
                    <span class="time-label">hours</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="minutes">--</span>
                    <span class="time-label">minutes</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="seconds">--</span>
                    <span class="time-label">seconds</span>
                </div>
            </div>
            <div id="expectedDate">Expected Date: --</div>
        </div>
        <div class="exam-grid" id="examGrid">
            <div class="exam-item" data-date="2026-04-01">JEE Mains 2026</div>
            <div class="exam-item" data-date="2026-05-18">JEE Advanced 2026</div>
            <div class="exam-item" data-date="2026-05-05">NEET 2026</div>
            <div class="exam-item" data-date="2026-05-26">BITSAT 2026</div>
            <div class="exam-item" data-date="2026-04-19">MHT-CET 2026</div>
            <div class="exam-item" data-date="2026-04-27">WBJEE 2026</div>
            <div class="exam-item" data-date="2026-05-10">COMEDK 2026</div>
            <div class="exam-item" data-date="2026-04-20">VITEEE 2026</div>
            <div class="exam-item" data-date="2026-04-19">UGEE 2026</div>
            <div class="exam-item" data-date="2026-05-25">IAT 2026</div>
            <div class="exam-item" data-date="2026-04-18">MET 2026</div>
            <div class="exam-item" data-date="2026-05-15">CUET 2026</div>
        </div>
    </div>

    <div class="footer-links">
        
        <a href="https://preprator.com" target="_blank">Powered by Preprator</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
